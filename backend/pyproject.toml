[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biovoice-backend"
version = "0.1.0"
description = "FastAPI backend for the BioVoice web refactor"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# F4 wired numpy + torch into the verification import chain
# (verification → sub_classifier → acoustic_features → numpy;
#  verification → speaker_encoder → torch). Treat them as base for any
# install that runs the test suite — there is no "tests-only" path that
# can skip them anymore.
model = [
  "numpy>=1.26",
  "torch>=2.2",
  "torchaudio>=2.2",
  "scipy>=1.11",
  "onnxruntime>=1.18",
  "huggingface_hub>=0.23",
  "speechbrain>=1.0",
  "packaging>=23",       # speechbrain imports `packaging`; not always pulled transitively
  "soundfile>=0.12",
  "scikit-learn>=1.3",   # ensemble detector: 16 ASVspoof5 LogisticRegression classifiers
  "PyMySQL>=1.1",        # MySQL store (used when DATABASE_URL=mysql+pymysql://...)
]
speaker_models = [
  "onnxruntime>=1.18",
  "huggingface_hub>=0.23",
  "speechbrain>=1.0",
  "packaging>=23",       # speechbrain imports `packaging`; not always pulled transitively
  "soundfile>=0.12",
]
# Voice-cloning spoof generation for DeepfakeLab. Both engines clone an
# enrolled target's voice from a reference WAV. Installed with
# `pip install -e .[model,spoof]`. XTTS also needs its weights pulled via
# `bash backend/scripts/setup_xtts.sh`; F5 fetches its checkpoints from
# Hugging Face on first use. TTS pins to <0.23 (upstream is unmaintained).
spoof = [
  "f5-tts>=1.1",                  # F5-TTS — flow-matching DiT zero-shot voice cloner
  "TTS>=0.22,<0.23",              # Coqui XTTS-v2 — autoregressive zero-shot cloner
  "transformers>=4.38,<4.41",     # TTS 0.22 needs BeamSearchScorer, removed in 4.41
]
# Test runner deps. CI installs `[model,test]` so `pytest` is on PATH +
# httpx is available for fastapi.testclient. Locally, the dev venv
# typically has both pinned via the operator's own `pip install pytest`,
# but declaring them here means a fresh checkout can run the suite with
# a single `pip install -e ".[model,test]"`.
test = [
  "pytest>=8.0",
  "httpx>=0.27",
]
# B2 — Real-dataset benchmarks (Plan.md v1.0.2). matplotlib for DET / ROC
# plot output, sklearn for the standard det_curve / roc_curve helpers.
# Out of CI scope; operator runs benchmarks locally with
# `pip install -e ".[model,bench]"` before invoking scripts/bench_*.py.
bench = [
  "matplotlib>=3.8",
  "scikit-learn>=1.4",
  "soundfile>=0.12",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
# `-m "not slow"` is the CI default — keeps the fast suite under 10 s.
# Run `pytest -m slow` to load real ReDimNet + AASIST weights and run
# the end-to-end integration test in tests/test_real_models_integration.py.
markers = [
  "slow: real model load (skipped by default; run with `pytest -m slow`)",
]
filterwarnings = [
  "ignore::DeprecationWarning",
]
